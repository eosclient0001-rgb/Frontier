<h1>Strand Editor · browser proof</h1>
<p class="note">Rendered by headless Chromium with WebGL2 (SwiftShader, no GPU) from the eight starter scenes in
<code>Experimental/StrandEditor/Source/Presets.js</code>. The browser proof passed 87 checks (<code>Proof.txt</code>).
Raw numbers are in <code>Measurements.json</code>. Frames are at t = 0 of each loop.</p>
