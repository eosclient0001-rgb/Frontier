<h1>Display panel: visual proof</h1>
<p>Frames are the PNG export of the editor in Panel view (1280 × 800), read back by <code>npm run panel-proof</code>. Each frame is compared with the same frame rendered without the panel. The panel changes pixels only inside its controls. The full report is in <a href="Proof.txt">Proof.txt</a>.</p>

<figure><img src="panel-preset-10.png" alt="Preset 10 in the display panel"><figcaption>Preset 10, Start transition, 2.5 s into the loop.</figcaption></figure>
