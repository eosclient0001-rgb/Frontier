<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frontier — Realtime WebGPU Cloth Studio</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="editor">
      <header class="brand">
        <div class="logo">FR</div>
        <div>
          <h1>Frontier <span>Cloth Studio</span></h1>
          <p id="gpuinfo">Initialising WebGPU…</p>
        </div>
      </header>

      <div class="swatch-wrap">
        <canvas id="fabricCanvas"></canvas>
        <div class="swatch-tag">
          <span id="fabricName">Indigo Silk</span>
          <span class="hint">material editor</span>
        </div>
      </div>

      <nav class="tabs">
        <button data-tab="fabric" class="active">Material</button>
        <button data-tab="dress">Dress</button>
        <button data-tab="physics">Physics</button>
        <button data-tab="body">Body</button>
        <button data-tab="scene">Scene</button>
      </nav>

      <div class="panes">
        <div class="pane active" data-pane="fabric"></div>
        <div class="pane" data-pane="dress"></div>
        <div class="pane" data-pane="physics"></div>
        <div class="pane" data-pane="body"></div>
        <div class="pane" data-pane="scene"></div>
      </div>
    </aside>

    <main id="stage">
      <canvas id="viewport"></canvas>
      <div class="hud top-left">
        <div class="pill"><b id="fps">—</b> fps</div>
        <div class="pill"><b id="verts">—</b> cloth points</div>
        <div class="pill"><b id="cons">—</b> constraints</div>
        <div class="pill" id="statuspill">simulating</div>
      </div>
      <div class="hud bottom-left">
        <div class="hint">drag orbit · wheel zoom · right-drag pan</div>
      </div>
      <div class="hud bottom-right">
        <button class="btn primary" id="btnPlay">Pause</button>
        <button class="btn" id="btnReset">Reset cloth</button>
        <button class="btn" id="btnDrop">Drop from body</button>
        <button class="btn" id="btnDance">Dance</button>
      </div>
      <div id="error" class="error" hidden></div>
    </main>
  </div>
  <script>
    // A raw-file proxy (raw.githack, raw.githubusercontent, ...) can return an
    // HTML error page for a .js request, which makes the module never execute.
    // Rather than leave a blank viewport, say what happened and where to go.
    (function () {
      var tries = 0;
      var timer = setInterval(function () {
        if (window.__frontierBooted) {
          clearInterval(timer);
          var hint = document.querySelector('#error[data-hint]');
          if (hint) hint.hidden = true;
          return;
        }
        if (++tries < 6) return;
        clearInterval(timer);
        var box = document.getElementById('error');
        if (!box || !box.hidden) return;
        box.hidden = false;
        box.dataset.hint = '1';
        box.innerHTML = '<b>The app modules did not load.</b><br><br>'
          + 'This page looks like it was opened through a raw file proxy, which sometimes serves '
          + '<code>.js</code> files with the wrong content type, so the browser refuses to run them as modules.'
          + '<br><br>Open the CDN mirror instead:<br>'
          + '<a href="https://cdn.jsdelivr.net/gh/eosclient0001-rgb/Frontier@arena/01a103c4-frontier/index.html">'
          + 'cdn.jsdelivr.net/gh/eosclient0001-rgb/Frontier@arena/01a103c4-frontier/index.html</a>'
          + '<br><br>or serve the folder locally: <code>npm run dev</code>';
      }, 1000);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
