<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Golden Eagle — 3D Model &amp; Animation</title>
    <style>
      :root {
        --bg: #0d1014;
        --panel: rgba(16, 19, 24, 0.82);
        --line: rgba(255, 255, 255, 0.1);
        --gold: #c9a24a;
        --gold-dim: #8a733f;
        --text: #e8e4dc;
        --dim: #9aa0a6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: var(--bg); color: var(--text); overflow: hidden;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      .panel {
        position: fixed; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 40px rgba(0,0,0,0.45);
      }

      #left { top: 14px; left: 14px; width: 268px; padding: 14px 14px 10px; max-height: calc(100% - 28px); overflow-y: auto; }
      #left h1 {
        margin: 0 0 2px; font-size: 15px; letter-spacing: 0.02em; font-weight: 650;
        color: var(--gold);
      }
      #left .sub { color: var(--dim); font-size: 11px; font-style: italic; margin-bottom: 12px; }

      .group-title {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
        color: var(--gold-dim); margin: 12px 0 6px; font-weight: 600;
      }
      #clips { display: flex; flex-direction: column; gap: 4px; }
      .clip {
        display: flex; flex-direction: column; align-items: flex-start;
        padding: 7px 10px; border-radius: 8px; cursor: pointer;
        background: rgba(255,255,255,0.035); border: 1px solid transparent;
        color: var(--text); text-align: left; font: inherit; transition: all 0.12s;
      }
      .clip:hover { background: rgba(255,255,255,0.08); }
      .clip.active { background: rgba(201,162,74,0.16); border-color: rgba(201,162,74,0.5); }
      .clip .grp { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-dim); }
      .clip.active .grp { color: var(--gold); }
      .clip .lbl { font-size: 13px; font-weight: 550; }

      #clipnote {
        margin-top: 10px; font-size: 11px; color: var(--dim); line-height: 1.5;
        border-left: 2px solid var(--gold-dim); padding-left: 8px; min-height: 32px;
      }

      #refdata table { width: 100%; border-collapse: collapse; font-size: 11px; }
      #refdata th {
        text-align: left; font-weight: 500; color: var(--dim);
        padding: 2px 0; white-space: nowrap;
      }
      #refdata td { text-align: right; padding: 2px 0; font-variant-numeric: tabular-nums; color: var(--text); }
      #refdata tr + tr th, #refdata tr + tr td { border-top: 1px solid rgba(255,255,255,0.05); }

      #bottom {
        bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px; padding: 10px 14px;
        width: min(720px, calc(100% - 28px));
      }
      #timeline { flex: 1; -webkit-appearance: none; appearance: none; height: 4px;
        background: rgba(255,255,255,0.14); border-radius: 2px; outline: none; }
      #timeline::-webkit-slider-thumb {
        -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: var(--gold); cursor: pointer; box-shadow: 0 0 0 3px rgba(201,162,74,0.2);
      }
      #timeline::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--gold); cursor: pointer; }
      #play, #slowmo {
        background: rgba(255,255,255,0.07); border: 1px solid var(--line); color: var(--text);
        padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap;
      }
      #play:hover, #slowmo:hover { background: rgba(255,255,255,0.13); }
      #speed { width: 74px; }
      #speedval { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 44px; }
      #fps { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

      #right { top: 14px; right: 14px; width: 172px; padding: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; font-size: 11px; color: var(--dim); }
      .row input[type=checkbox] { accent-color: var(--gold); }
      .row input[type=range] { width: 74px; accent-color: var(--gold); }

      .badge {
        position: fixed; left: 14px; bottom: 16px; font-size: 10px; color: var(--dim);
        max-width: 250px; line-height: 1.5;
      }
      .badge a { color: var(--gold-dim); }
      @media (max-width: 780px) {
        #right { display: none; }
        #left { width: 210px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <aside class="panel" id="left">
      <h1>Golden Eagle</h1>
      <div class="sub">Aquila chrysaetos canadensis · adult female</div>

      <div class="group-title">Flight</div>
      <div id="clips"></div>
      <div id="clipnote"></div>

      <div class="group-title">Reference data</div>
      <div id="refdata"></div>
    </aside>

    <aside class="panel" id="right">
      <div class="row"><span>Wireframe</span><input type="checkbox" id="wire" /></div>
      <div class="row"><span>Skeleton</span><input type="checkbox" id="skeleton" /></div>
      <div class="row"><span>Sun</span><input type="range" id="sun" min="4" max="176" value="52" /></div>
    </aside>

    <div class="panel" id="bottom">
      <button id="play">❚❚  Pause</button>
      <input type="range" id="timeline" min="0" max="1000" value="0" />
      <button id="slowmo">Slow-mo</button>
      <input type="range" id="speed" min="0.02" max="2" step="0.01" value="1" />
      <span id="speedval">1.00×</span>
      <span id="fps">—</span>
    </div>

    <div class="badge">
      Drag to orbit · scroll to zoom · right-drag to pan.<br />
      Reference: Lish et al. <i>J. Raptor Res.</i> 50(1) · Trail 2017 · PNAS 2021
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
