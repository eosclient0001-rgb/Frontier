<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontier — Real-time Volumetric Fluids</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif;color:#e8ecf1}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #ui{position:fixed;top:12px;left:12px;width:270px;background:rgba(18,22,28,.82);backdrop-filter:blur(8px);border:1px solid #2a323d;border-radius:10px;padding:12px 14px;max-height:calc(100% - 50px);overflow:auto}
  h1{font-size:15px;margin:0 0 2px} .sub{opacity:.6;font-size:11px;margin-bottom:8px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin:12px 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:5px}
  button{background:#232b36;color:#dfe6ee;border:1px solid #35404e;border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
  button:hover{background:#2d3744} button.on{background:#2f6fd6;border-color:#4b8af0;color:#fff}
  label{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:6px;margin:4px 0;font-size:12px}
  label em{font-style:normal;opacity:.7;text-align:right;font-size:11px}
  input[type=range]{width:100%}
  #stats{position:fixed;right:12px;top:12px;background:rgba(18,22,28,.8);padding:6px 10px;border-radius:6px;font-size:12px}
  #help{opacity:.6;font-size:11px;margin-top:10px}
  #err{display:none;position:fixed;inset:30% 20% auto;background:#400;padding:20px;border-radius:8px;white-space:pre-wrap}
  body.hideui #ui{display:none}
  #hide{position:fixed;right:12px;bottom:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Frontier Fluids</h1>
  <div class="sub">GPU FLIP/PIC solver · screen-space fluid rendering</div>
  <h2>Fluid A (scene)</h2><div class="row" id="mats"></div>
  <h2>Fluid B (poured in)</h2><div class="row" id="mats2"></div>
  <div class="row" style="margin-top:6px"><button id="pourB">Pour B (key B)</button></div>
  <label style="margin-top:6px"><span>Mixing rate</span><input type="range" id="mixr" min="0" max="2" step="0.01" value="0.15"><em id="mixv">0.15</em></label>
  <h2>Scenario</h2><div class="row" id="scen"></div>
  <h2>Properties</h2><div class="row" id="edit"></div><div id="sliders"></div>
  <h2>Thrown objects</h2><div class="row" id="balls"></div>
  <h2>Quality</h2><div class="row" id="qual"></div>
  <h2>Controls</h2>
  <div class="row"><button id="reset">Reset (R)</button><button id="pause">Pause</button><button id="debug">Particles (P)</button></div>
  <div id="help">Drag to orbit · scroll to zoom · <b>click to throw an object</b> · 1–5 switch fluid A live · B pours fluid B</div>
</div>
<div id="stats"></div>
<button id="hide">Toggle UI</button>
<div id="err"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
