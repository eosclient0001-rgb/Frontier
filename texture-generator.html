<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontier · PBR Sand & Texture Studio</title>

  <!-- General Sans font from Fontshare -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/slate.css">
  <style>
    .map-tabs {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      padding: 4px;
      border-radius: var(--radius-md);
      z-index: 50;
    }
    .map-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-faint);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .map-tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    .map-tab-btn.active {
      color: #fff;
      background: var(--accent);
    }
    #map-2d-canvas {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #08090c;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Notch / Control Center -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
        </div>
        <div>
          <div class="brand-title">PBR Texture Studio</div>
        </div>
        <div class="brand-badge">Sand & Pebbles</div>
      </div>

      <div class="top-actions">
        <a href="/" class="btn ghost small" title="Return to 3D SDF Terrain Studio">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
          Terrain Studio
        </a>
        <a href="/rock-crack-studio.html" class="btn ghost small" title="Open Standalone Rock Crack & SDF Erosion Studio">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Rock Crack Studio
        </a>

        <div style="height: 20px; width: 1px; background: var(--stroke); margin: 0 4px;"></div>

        <button class="btn primary" id="btn-generate" title="Generate New Sand Texture (Space / G)">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
          Synthesize
        </button>

        <select class="select-field" id="select-preset" title="Sand Biome Preset"></select>

        <select class="select-field" id="select-model" title="3D Preview Model">
          <option value="plane">Deformable Plane</option>
          <option value="sphere">3D Sphere</option>
          <option value="cube">3D Cube</option>
        </select>

        <select class="select-field" id="select-res" title="Texture Resolution">
          <option value="512">512 × 512 (Fast)</option>
          <option value="1024" selected>1024 × 1024 (HD)</option>
          <option value="2048">2048 × 2048 (2K Master)</option>
        </select>

        <button class="btn ghost icon" id="btn-wireframe" title="Toggle Wireframe (W)">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </button>
      </div>

      <div class="top-right">
        <button class="btn ghost small" id="btn-export-pbr" title="Export Full PBR Texture Map Suite (PNG)">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export 2K PBR Maps
        </button>

        <div class="status-pill">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Ready</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Center 3D Viewport & 2D Map Inspector -->
      <section class="viewport-area">
        <div id="texture-viewport-container" style="width: 100%; height: 100%;"></div>
        <canvas id="map-2d-canvas"></canvas>

        <!-- Bottom Map Inspection Tabs -->
        <div class="map-tabs">
          <button class="map-tab-btn active" data-map="3d">3D PBR Viewport</button>
          <button class="map-tab-btn" data-map="albedo">Albedo (RGB)</button>
          <button class="map-tab-btn" data-map="normal">Normal (OpenGL)</button>
          <button class="map-tab-btn" data-map="height">Displacement (Height)</button>
          <button class="map-tab-btn" data-map="roughness">Roughness</button>
          <button class="map-tab-btn" data-map="ao">Ambient Occlusion (AO)</button>
        </div>

        <div class="hud-probe">
          Rotate: Left Click + Drag | Pan: Right Click | Zoom: Scroll Wheel (Zoom in close to inspect sand grains & pebbles)
        </div>
      </section>

      <!-- Right Inspector -->
      <aside class="inspector-panel">
        <div class="panel-header">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <div>
            <div class="ph-title">Sand & Pebble Inspector</div>
            <div class="ph-sub">Procedural PBR Synthesizer</div>
          </div>
        </div>

        <div class="panel-body" id="texture-inspector-body"></div>
      </aside>
    </main>
  </div>

  <script type="module" src="src/texture-app.js"></script>
</body>
</html>
