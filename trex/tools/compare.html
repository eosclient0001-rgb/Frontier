<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>T. rex — model vs reference skeletal diagram</title>
<style>
  body { background:#12141a; color:#e8ecf4; font:14px/1.5 system-ui, sans-serif; margin:0; padding:18px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { color:#8b93a7; font-size:12px; margin-bottom:14px; }
  canvas { background:#fff; border-radius:6px; display:block; max-width:100%; }
  pre { background:#1b1f27; padding:12px; border-radius:6px; overflow:auto; font-size:12px; }
  iframe { width:900px; height:400px; border:0; position:absolute; left:-9999px; }
  .legend span { display:inline-block; margin-right:18px; }
  .sw { display:inline-block; width:12px; height:12px; vertical-align:-2px; margin-right:5px; border-radius:2px; }
</style>
</head>
<body>
<h1>Model vs reference skeletal diagram</h1>
<div class="sub" id="sub">measuring…</div>
<div class="legend" style="margin-bottom:10px">
  <span><i class="sw" style="background:#5b6472"></i>reference skeleton (Hartman, FMNH PR 2081 “Sue”)</span>
  <span><i class="sw" style="background:#e8833a"></i>this model</span>
  <span><i class="sw" style="background:#cfd6e2"></i>grid: 1 m</span>
</div>
<canvas id="out" width="1300" height="470"></canvas>
<pre id="txt">…</pre>
<iframe id="fr" src="../index.html?sil"></iframe>

<script>
// ── reference image ───────────────────────────────────────────────────────────
const REF = {
  file: '/image-search/tyrannosaurus-rex-skeletal-diagram-later-2.webp',
  totalLength: 12.35,   // published axial length of FMNH PR 2081, metres
};

const largestComponent = (mask, w, h) => {
  const seen = new Uint8Array(w * h); let best = null;
  const stack = new Int32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    if (!mask[i] || seen[i]) continue;
    let sp = 0; stack[sp++] = i; seen[i] = 1; const comp = [];
    while (sp) {
      const p = stack[--sp]; comp.push(p);
      const x = p % w, y = (p / w) | 0;
      if (x > 0 && mask[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; stack[sp++] = p - 1; }
      if (x < w - 1 && mask[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; stack[sp++] = p + 1; }
      if (y > 0 && mask[p - w] && !seen[p - w]) { seen[p - w] = 1; stack[sp++] = p - w; }
      if (y < h - 1 && mask[p + w] && !seen[p + w]) { seen[p + w] = 1; stack[sp++] = p + w; }
    }
    if (!best || comp.length > best.length) best = comp;
  }
  const out = new Uint8Array(w * h); for (const p of best) out[p] = 1; return out;
};

// top/bottom envelope (in pixels) for every column that has ink
function envelope(mask, w, h) {
  const top = new Float32Array(w).fill(NaN), bot = new Float32Array(w).fill(NaN);
  for (let x = 0; x < w; x++) {
    let t = -1, b = -1;
    for (let y = 0; y < h; y++) { if (mask[y * w + x]) { if (t < 0) t = y; b = y; } }
    if (t >= 0) { top[x] = t; bot[x] = b; }
  }
  return { top, bot };
}

function loadRef() {
  return new Promise((res, rej) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      const mask = new Uint8Array(c.width * c.height);
      for (let i = 0; i < mask.length; i++) {
        const l = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
        mask[i] = l < 140 ? 1 : 0;
      }
      res(largestComponent(mask, c.width, c.height));
    };
    img.onerror = rej; img.src = REF.file;
  });
}

// ── model silhouette from the iframe ──────────────────────────────────────────
function waitForFrame() {
  return new Promise((res) => {
    const fr = document.getElementById('fr');
    const tick = () => {
      try {
        const w = fr.contentWindow;
        if (w && w.__trex && w.__trex.silhouette) return res(w);
      } catch (e) { /* not ready */ }
      setTimeout(tick, 250);
    };
    fr.onload = tick; tick();
  });
}

// resample an envelope onto N columns spanning [0,len] metres
function profile(env, w, mpp, len, N, flipX, groundY, snoutX) {
  const out = new Float32Array(N).fill(NaN);
  for (let i = 0; i < N; i++) {
    const xm = (i + 0.5) / N * len;
    let px = Math.round(flipX ? snoutX - xm / mpp : snoutX + xm / mpp);
    px = Math.min(w - 1, Math.max(0, px));
    if (!isNaN(env[px])) out[i] = (groundY - env[px]) * mpp;
  }
  return out;
}

function compare(a, b, N) {           // mean absolute difference, ignoring empty columns
  let n = 0, sum = 0, worst = 0, worstI = -1;
  for (let i = 0; i < N; i++) {
    if (isNaN(a[i]) || isNaN(b[i])) continue;
    const d = Math.abs(a[i] - b[i]); sum += d; n++;
    if (d > worst) { worst = d; worstI = i; }
  }
  return { mean: n ? sum / n : NaN, worst, worstAt: worstI / N, samples: n };
}

// capture the model silhouette and return {top,bottom} profiles on an N-wide grid
function modelProfiles(T, sil, N, flipSnout) {
  let a0 = 1e9, a1 = -1, b0 = 1e9, b1 = -1;
  for (let y = 0; y < sil.h; y++) for (let x = 0; x < sil.w; x++) if (sil.data[y * sil.w + x]) {
    if (x < a0) a0 = x; if (x > a1) a1 = x; if (y < b0) b0 = y; if (y > b1) b1 = y;
  }
  const mpp = sil.length / (a1 - a0 + 1), en = envelope(sil.data, sil.w, sil.h);
  return {
    top: profile(en.top, sil.w, mpp, sil.length, N, flipSnout, b1, flipSnout ? a1 : a0),
    bot: profile(en.bot, sil.w, mpp, sil.length, N, flipSnout, b1, flipSnout ? a1 : a0),
  };
}

async function run() {
  const refMask = await loadRef();
  const rw = 1425, rh = 452;                       // reference image size
  let rminx = 1e9, rmaxx = -1, rminy = 1e9, rmaxy = -1;
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) if (refMask[y * rw + x]) {
    if (x < rminx) rminx = x; if (x > rmaxx) rmaxx = x; if (y < rminy) rminy = y; if (y > rmaxy) rmaxy = y;
  }
  const refW = rmaxx - rminx + 1;
  const refMpp = REF.totalLength / refW;
  const refEnv = envelope(refMask, rw, rh);
  const N = 320;

  const w = await waitForFrame();
  const T = w.__trex;
  T.state.auto = false; T.setGait('idle'); T.sim(1 / 60, 900);   // settle into a standing pose

  // which way round is the reference? try both and keep the better match
  const refFor = (flip) => ({
    top: profile(refEnv.top, rw, refMpp, REF.totalLength, N, flip, rmaxy, flip ? rmaxx : rminx),
    bot: profile(refEnv.bot, rw, refMpp, REF.totalLength, N, flip, rmaxy, flip ? rmaxx : rminx),
  });
  const poseSpread = (sp) => { for (const leg of T.legs) leg.stance = true;
    T.legs[0].C.x = sp; T.legs[1].C.x = -sp; T.sim(0, 1); };

  let flip = false, ref = refFor(false), bestScore = 1e9;
  for (const f of [false, true]) {
    const r = refFor(f); poseSpread(1.3);
    const m = modelProfiles(T, T.silhouette(1300, 0, 1), N, false);
    const sc = compare(r.top, m.top, N).mean + compare(r.bot, m.bot, N).mean;
    if (sc < bestScore) { bestScore = sc; flip = f; ref = r; }
  }

  // the drawing is a mid-stride pose: sweep the foot spread that best matches its footfall line
  let bestSpread = 1.3, bestBot = 1e9;
  for (let sp = 0.5; sp <= 1.85; sp += 0.1) {
    poseSpread(sp);
    const m = modelProfiles(T, T.silhouette(1300, 0, 1), N, false);
    const e = compare(ref.bot, m.bot, N).mean;
    if (e < bestBot) { bestBot = e; bestSpread = sp; }
  }
  poseSpread(bestSpread);

  // auto-tune the tail's resting downward arc
  const sweep = [];
  for (let sc = 0.3; sc <= 1.5001; sc += 0.1) {
    T.state.tailDroop = sc; T.sim(0, 1);
    const m = modelProfiles(T, T.silhouette(1300, 0, 1), N, false);
    sweep.push([+sc.toFixed(2), +compare(ref.top, m.top, N).mean.toFixed(3)]);
  }
  sweep.sort((a, b) => a[1] - b[1]);
  const bestDroop = sweep[0][0];
  T.state.tailDroop = bestDroop; T.sim(0, 1);

  // final measurement
  const sil = T.silhouette(1300, 0, 1);
  const mod = modelProfiles(T, sil, N, false);
  const ct = compare(ref.top, mod.top, N), cb = compare(ref.bot, mod.bot, N);
  const mx = (p) => { let m = 0; for (const v of p) if (!isNaN(v) && v > m) m = v; return +m.toFixed(2); };
  const dump = (p) => Array.from({ length: 33 }, (_, k) => { const i = Math.min(N - 1, Math.round(k / 32 * (N - 1)));
    return p[i] === undefined || isNaN(p[i]) ? null : +p[i].toFixed(2); });

  const report = {
    reference: { image: REF.file.split('/').pop(), totalLength: REF.totalLength, bboxPx: [refW, rmaxy - rminy + 1], flipped: flip },
    model: { totalLength: +sil.length.toFixed(2), height: +sil.height.toFixed(2) },
    lengthErrorPct: +((sil.length / REF.totalLength - 1) * 100).toFixed(1),
    topProfile: { meanError_m: +ct.mean.toFixed(3), worst_m: +ct.worst.toFixed(3), worstAtFraction: +ct.worstAt.toFixed(2) },
    bottomProfile: { meanError_m: +cb.mean.toFixed(3), worst_m: +cb.worst.toFixed(3), worstAtFraction: +cb.worstAt.toFixed(2) },
    tallestPoint: { reference: mx(ref.top), model: mx(mod.top) },
    tuned: { footSpread_m: +bestSpread.toFixed(2), tailDroop: bestDroop },
    tailDroopSweep: sweep,
    profiles: { refTop: dump(ref.top), refBottom: dump(ref.bot), modelTop: dump(mod.top), modelBottom: dump(mod.bot) },
  };

  // ── draw the overlay ────────────────────────────────────────────────────────
  const cv = document.getElementById('out'), g = cv.getContext('2d');
  const L = Math.max(REF.totalLength, sil.length);
  const pad = 30, sc = (cv.width - pad * 2) / L, oy = cv.height - 40, vs = sc * 0.92;
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#cfd6e2'; g.lineWidth = 1;
  for (let m = 0; m <= Math.ceil(L); m++) { const x = pad + m * sc; g.beginPath(); g.moveTo(x, 20); g.lineTo(x, oy); g.stroke(); }
  for (let m = 0; m <= 6; m++) { const y = oy - m * vs; g.beginPath(); g.moveTo(pad, y); g.lineTo(cv.width - pad, y); g.stroke(); }
  const drawShape = (top, bot, len, fill, stroke) => {
    g.beginPath(); let started = false;
    for (let i = 0; i < N; i++) { const x = pad + (i + 0.5) / N * len * sc; if (isNaN(top[i])) continue;
      const y = oy - top[i] * vs; if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y); }
    for (let i = N - 1; i >= 0; i--) { const x = pad + (i + 0.5) / N * len * sc; if (isNaN(bot[i])) continue; g.lineTo(x, oy - bot[i] * vs); }
    g.closePath(); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); }
  };
  drawShape(ref.top, ref.bot, REF.totalLength, 'rgba(91,100,114,0.55)', null);
  drawShape(mod.top, mod.bot, sil.length, 'rgba(232,131,58,0.45)', '#e8833a');
  g.fillStyle = '#12141a'; g.font = '13px system-ui';
  g.fillText('0 m', pad, oy + 20); g.fillText(L.toFixed(1) + ' m', pad + L * sc - 40, oy + 20);
  g.fillText('snout →', pad + 6, 16);

  const shown = Object.assign({}, report); delete shown.profiles; delete shown.tailDroopSweep;
  document.getElementById('txt').textContent = JSON.stringify(shown, null, 1);
  document.getElementById('sub').textContent =
    `mean silhouette error — top line ${(ct.mean * 100).toFixed(0)} cm, underside ${(cb.mean * 100).toFixed(0)} cm; length ${report.lengthErrorPct > 0 ? '+' : ''}${report.lengthErrorPct}%`;
  window.__result = report; window.__png = cv.toDataURL('image/png');
  window.__done = true;
}
run().catch((e) => { document.getElementById('txt').textContent = 'ERROR ' + e.message; window.__done = true; });
</script>
</body>
</html>
